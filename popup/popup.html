<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperGenPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <label>
        Domain
        <input id="domain" type="text" autocomplete="off" />
      </label>

      <label>
        Master Password
        <input id="master" type="password" autocomplete="off" autofocus />
      </label>

      <button id="generate" type="button">Generate</button>

      <div class="field">
        <label for="generated">Site Password</label>
        <div class="generated-field">
          <input id="generated" type="password" readonly />
          <button id="toggle-generated" type="button" aria-controls="generated" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="actions">
        <button id="copy" type="button">Copy</button>
        <button id="fill" type="button">Fill</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="../src/sgp-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
