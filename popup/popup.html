<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SuperGenPass</title>

		<script src="lib/md5.min.js"></script>
		<script src="lib/sha1.min.js"></script>
		<script src="lib/sha256.min.js"></script>

		<link rel="stylesheet" href="popup.css" />
		<link rel="stylesheet" href="bootstrap.min.css" />
	</head>
	<body data-bs-theme="dark">
		<main>
			<label>
				Domain
				<input class="form-control form-control-sm" id="domain" type="text" autocomplete="off" required />
			</label>

			<label id="master-password">
				Master Password
				<div class="input-group input-group-sm">
					<input class="form-control form-control-sm" id="master" type="password" autocomplete="current-password" required autofocus />
					<canvas id="master-image" width="16" height="16" aria-hidden="true"></canvas>
					<button class="btn btn-secondary" id="save_button" title="Save master password for this session">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-floppy" viewBox="0 0 16 16">
							<path d="M11 2H9v3h2z"/>
							<path d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
						</svg>
					</button>
				</div>
			</label>

			<div class="d-flex flex-row" id="color_box_wrapper">
				<div class="border flex-fill"></div>
				<div class="border flex-fill"></div>
				<div class="border flex-fill"></div>
				<div class="border flex-fill"></div>
				<div class="border flex-fill"></div>
				<div class="border flex-fill"></div>
			</div>

			<div class="button-group">
				<button class="w-100 btn btn-primary btn-sm" id="generate" type="button">Generate</button>
				<button class="w-100 btn btn-info btn-sm d-none" id="copy" type="button">Copy</button>
				<button class="w-100 btn btn-success btn-sm d-none" id="fill" type="button">Fill</button>
			</div>

			<div class="field">
				<label for="generated">Site Password</label>
				<div class="input-group input-group-sm">
					<input class="form-control font-monospace" id="generated" type="password" readonly />
					<button class="btn btn-secondary" id="toggle-generated" type="button" aria-controls="generated" aria-pressed="false">
						<svg xmlns="http://www.w3.org/2000/svg" height="20px" width="20px" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
							<path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
						</svg></button>
				</div>
			</div>

			<p id="status" role="status" aria-live="polite"></p>

		</main>

		<script src="../src/sgp-core.js"></script>
		<script src="../src/sgp-image.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
