<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperGenPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <label>
        Domain
        <input id="domain" type="text" autocomplete="off" />
      </label>

      <label>
        Master Password
        <input id="master" type="password" autocomplete="off" autofocus />
      </label>
      <canvas id="master-image" width="16" height="16" aria-hidden="true"></canvas>

      <button id="generate" type="button">Generate</button>

      <label>
        Site Password
        <input id="generated" type="text" readonly />
      </label>

      <div class="actions">
        <button id="copy" type="button">Copy</button>
        <button id="fill" type="button">Fill</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="../src/sgp-core.js"></script>
    <script src="../src/sgp-image.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
